# Safe local-development security defaults. Production should bind endpoints
# explicitly for its network and review these settings before launch.
sv_scriptHookAllowed 0
set sv_devMode false
set sv_filterRequestControl 2
set sv_enableNetworkedSounds false
set sv_enablePhoneExplosions false
set sv_enableNetworkedScriptEntityStates false
setr voice_debugMode 0

# Loopback endpoints already prevent remote access in development. Keep local
# JSON endpoints usable by readiness checks.
set sv_requestParanoia 0
