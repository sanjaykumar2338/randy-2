# Optional development overrides after deploying the official Qbox txAdmin recipe.
# Copy to an ignored local cfg or merge manually into the generated server.cfg.

sv_hostname "Tarrant County RP - Development"
sets sv_projectName "Tarrant County RP"
sets sv_projectDesc "Development Qbox build for Week 1 playable-foundation testing"
sets locale "en-US"
sets tags "development, qbox"

sv_maxclients 8
sv_scriptHookAllowed 0
sv_enforceGameBuild 3258

# Keep inventory framework selection before ox_inventory starts.
setr inventory:framework "qbx"

# Keep real values in ignored local config only.
set mysql_connection_string "mysql://tarrant_rp:CHANGE_ME@127.0.0.1:3306/tarrant_rp_dev?charset=utf8mb4"
sv_licenseKey "CHANGE_ME"
