# Optional overrides for the existing staged Qbox server-data.
# Copy to an ignored local cfg and exec it before resources start.
# Do not deploy another Qbox recipe into the already-initialized database.

sv_hostname "Tarrant County RP - Development"
sets sv_projectName "Tarrant County RP"
sets sv_projectDesc "Development Qbox build for Week 1 playable-foundation testing"
sets locale "en-US"
sets tags "development, qbox"

sv_maxclients 8
sv_scriptHookAllowed 0
sv_enforceGameBuild 3258

# Keep inventory framework selection before ox_inventory starts.
setr inventory:framework "qbx"

# Database credentials and the Cfx.re license key belong in ignored
# development.cfg, not in this overrides file.
