# Tarrant RP loopback-only development FXServer template.
# Copy this as server.cfg in an ignored staged server-data directory.

endpoint_add_tcp "127.0.0.1:30120"
endpoint_add_udp "127.0.0.1:30120"

# Development-only: suppress public Cfx listing for this loopback profile.
# Staging and production configurations must not activate this directive.
sv_master1 ""

sv_hostname "Tarrant County RP - Development"
sets sv_projectName "Tarrant County RP - Development"
sets sv_projectDesc "Phase 1 Qbox development runtime"
sets locale "en-US"
sets tags "development, qbox"

sv_maxclients 8
set onesync on
set steam_webApiKey "none"
exec development.cfg
exec voice.cfg
exec base.cfg
exec security.cfg
exec discord.cfg
exec permissions.cfg
exec staff.cfg
setr tarrant_environment "development"

# ox.cfg is copied from the pinned official recipe into ignored server-data.
exec ox.cfg

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Explicit minimum dependency order.
ensure ox_lib
ensure oxmysql
ensure qbx_core
ensure qbx_vehicles
ensure ox_target
ensure ox_inventory
ensure qbx_spawn
ensure illenium-appearance
ensure pma-voice
ensure qbx_hud
ensure tarrant_ops

exec misc.cfg
