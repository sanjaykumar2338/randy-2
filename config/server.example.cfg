# Tarrant RP local development FXServer template.
# Copy this to config/server.cfg or server.cfg and keep the real file out of Git.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Tarrant County RP - Development"
sets sv_projectName "Tarrant County RP"
sets sv_projectDesc "Local development environment for a Qbox-based lifestyle/economy RP server"
sets locale "en-US"
sets tags "development, qbox"

sv_maxclients 8
set onesync on
sv_scriptHookAllowed 0
sv_enforceGameBuild 3258

# Keep real development-only values in config/development.cfg.
# exec config/development.cfg

# Required for any local FXServer run. Replace only in ignored local config.
sv_licenseKey "CHANGE_ME"

# Qbox framework/resource order must come from the official txAdmin recipe.
# See docs/week1-runtime.md before replacing this template with recipe output.
# ensure oxmysql
# ensure qbx_core
# ensure [tarrant]
